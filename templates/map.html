<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fly By - Viewer</title>

    <!-- Leaflet CSS and JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Styling -->
     <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
        }
 
        #map {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script>
        // Initialize the map and set it to a specific location and zoom level, no tiles yet
        var map = L.map('map').setView([ {{ def_lat }}, {{ def_long }}], 10);

        // Add the OpenStreetMap tile layer to the map
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a>'
        }).addTo(map);

        // Keyed by icao24 so existing markers get moved in place instead of
        // being destroyed and recreated every refresh (that's what was
        // causing the multi-second blank gap).
        var flightMarkers = {};
 
        function updateMarkers(flights) {
            var seen = {};
 
            flights
                .filter(function (f) { return !f.on_ground && f.lat != null && f.lon != null; })
                .forEach(function (f) {
                    var id = f.icao24;
                    seen[id] = true;
                    var label = f.callsign || f.icao24;
 
                    if (flightMarkers[id]) {
                        flightMarkers[id].setLatLng([f.lat, f.lon]);
                        flightMarkers[id].setPopupContent(label);
                    } else {
                        flightMarkers[id] = L.marker([f.lat, f.lon]).addTo(map).bindPopup(label);
                    }
                });
 
            Object.keys(flightMarkers).forEach(function (id) {
                if (!seen[id]) {
                    map.removeLayer(flightMarkers[id]);
                    delete flightMarkers[id];
                }
            });
        }
 
        function refreshFlights() {
            var bounds = map.getBounds();
            var params = new URLSearchParams({
                min_lat: bounds.getSouth(),
                max_lat: bounds.getNorth(),
                min_lon: bounds.getWest(),
                max_lon: bounds.getEast()
            });

            fetch('/get-flights?' + params.toString())
                .then(function (resp) { return resp.json(); })
                .then(function (data) {
                    if (data.error) {
                        // Request failed / rate-limited — keep showing last known markers
                        console.warn('get-flights error, keeping stale markers:', data.error);
                        return;
                    }
                    console.log('get-flights returned', data.count, 'flights', data);
                    updateMarkers(data.flights || []);
                })
                .catch(function (err) { console.error('Failed to fetch flights:', err); });
        }
 
 
        // Initial load, plus a periodic refresh so flights keep moving even
        // if you're not touching the map
        refreshFlights();
        setInterval(refreshFlights, 12000);
    </script>
</body>
</html>
